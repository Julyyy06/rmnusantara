<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 220" role="img" aria-label="Logo Nusa &amp; Spice" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Nusa &amp; Spice</title>
  <defs>
    <path id="petal" d="M0 -16 C15 -32 15 -54 0 -68 C-15 -54 -15 -32 0 -16 Z"/>
  </defs>

  <!-- Lambang: bunga lawang (star anise) dikelilingi titik pulau -->
  <g transform="translate(110 110)">
    <use href="#petal" fill="#E8731F"/>
    <use href="#petal" fill="#F2A64A" transform="rotate(45)"/>
    <use href="#petal" fill="#E8731F" transform="rotate(90)"/>
    <use href="#petal" fill="#F2A64A" transform="rotate(135)"/>
    <use href="#petal" fill="#E8731F" transform="rotate(180)"/>
    <use href="#petal" fill="#F2A64A" transform="rotate(225)"/>
    <use href="#petal" fill="#E8731F" transform="rotate(270)"/>
    <use href="#petal" fill="#F2A64A" transform="rotate(315)"/>
    <circle r="9" fill="#3B2A1E"/>
    <g fill="#B8431A">
      <circle r="3.2" cx="0" cy="-86" transform="rotate(22.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(67.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(112.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(157.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(202.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(247.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(292.5)"/>
      <circle r="3.2" cx="0" cy="-86" transform="rotate(337.5)"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="225" y="128" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="1" fill="#3B2A1E">Nusa<tspan fill="#E8731F" font-style="italic" font-weight="400" font-size="82" dx="16">&amp;</tspan><tspan dx="16" font-style="italic" font-weight="400">Spice</tspan></text>

  <!-- Tagline -->
  <line x1="227" y1="156" x2="257" y2="156" stroke="#E8731F" stroke-width="2"/>
  <text x="227" y="182" font-family="'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" letter-spacing="6" fill="#8A6A52">INDONESIAN SPICE KITCHEN</text>
</svg>
