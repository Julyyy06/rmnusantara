<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280" role="img" aria-label="Nusa &amp; Spice">
<defs>
<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FBF6EF"/><stop offset="1" stop-color="#FBDCC0"/></linearGradient>
<clipPath id="c"><rect x="0" y="150" width="0" height="50"><animate attributeName="width" from="0" to="700" dur="2.8s" begin="0.9s" fill="freeze"/></rect></clipPath>
<path id="petal" d="M0 -14 C13 -28 13 -47 0 -60 C-13 -47 -13 -28 0 -14 Z"/>
</defs>
<style>
.t{font:700 46px Georgia,'Times New Roman',serif;fill:#3B2A1E;animation:up 1s ease-out both}
.amp{fill:#E8731F;font-style:italic;font-weight:400}
.s2{font:400 24px Georgia,serif;font-style:italic;fill:#C4570F}
.s3{font:500 15px system-ui,sans-serif;fill:#8A6A52;letter-spacing:3px;animation:up 1s 3.4s ease-out both}
.f{animation:fl 4s ease-in-out infinite}
.st{fill:none;stroke:#E8731F;stroke-width:5;stroke-linecap:round;stroke-dasharray:60;animation:sm 2.6s ease-out infinite}
.w1{animation:wv 9s linear infinite}.w2{animation:wv 6s linear infinite}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes sm{0%{stroke-dashoffset:60;opacity:0;transform:translateY(8px)}30%{opacity:.9}100%{stroke-dashoffset:0;opacity:0;transform:translateY(-14px)}}
@keyframes wv{to{transform:translateX(-900px)}}
</style>
<rect width="900" height="280" fill="url(#g)"/>
<path class="w1" d="M0 240 Q112 214 225 240 T450 240 T675 240 T900 240 T1125 240 T1350 240 T1575 240 T1800 240 V280 H0Z" fill="#E8731F" opacity=".3"/>
<path class="w2" d="M0 252 Q112 228 225 252 T450 252 T675 252 T900 252 T1125 252 T1350 252 T1575 252 T1800 252 V280 H0Z" fill="#E8731F"/>
<!-- Lambang: bunga lawang -->
<g class="f" transform="translate(770 122)">
<circle r="76" fill="#FFFBF4" stroke="#E8731F" stroke-width="6"/>
<use href="#petal" fill="#E8731F"/>
<use href="#petal" fill="#F2A64A" transform="rotate(45)"/>
<use href="#petal" fill="#E8731F" transform="rotate(90)"/>
<use href="#petal" fill="#F2A64A" transform="rotate(135)"/>
<use href="#petal" fill="#E8731F" transform="rotate(180)"/>
<use href="#petal" fill="#F2A64A" transform="rotate(225)"/>
<use href="#petal" fill="#E8731F" transform="rotate(270)"/>
<use href="#petal" fill="#F2A64A" transform="rotate(315)"/>
<circle r="10" fill="#3B2A1E"/>
<path class="st" d="M-30 -78 q-9 -12 0 -22"/><path class="st" style="animation-delay:.8s" d="M0 -84 q-9 -12 0 -22"/><path class="st" style="animation-delay:1.6s" d="M30 -78 q-9 -12 0 -22"/>
</g>
<text class="t" x="56" y="118">Nusa<tspan class="amp" font-size="62" dx="14">&amp;</tspan><tspan dx="14" font-style="italic" font-weight="400">Spice</tspan></text>
<text class="s2" x="56" y="176" clip-path="url(#c)">Dapur rempah dari seluruh Nusantara</text>
<text class="s3" x="56" y="218">JL. RAYA BINONG NO. 30 &#183; PESAN &amp; RESERVASI VIA WHATSAPP</text>
</svg>
